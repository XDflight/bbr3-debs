name: build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch"
        required: false

  schedule:
    - cron: "21 07 * * 1"
    
jobs:

  build:
    name: ${{ matrix.branch }}_${{ matrix.arch }}
    runs-on: ${{ (matrix.arch == 'amd64' || matrix.arch == 'i386') && 'ubuntu-latest' || 'ubuntu-22.04-arm' }}
    permissions:
      contents: write
    strategy:
      matrix: 
        branch: >-
          ${{ fromJSON(github.event.inputs.branch && format('["{0}"]', github.event.inputs.branch) || 
                       '["linux-rolling-stable", "linux-rolling-lts", "linux-6.1.y"]') }}
        arch: ["amd64", "i386", "arm64", "armhf", "riscv64"]
        
    steps:
      - name: "free"
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: "env"
        run: |
          echo -e "DATE=$(date --rfc-3339=date)" >> ${GITHUB_ENV}
          
          if [[ "${{ matrix.arch }}" == "amd64" ]]; then
            echo -e "MAKE_ENV=" >> ${GITHUB_ENV}
            echo -e "ARCH_DESC=\`amd64\` / \`x86-64\`" >> ${GITHUB_ENV}
          fi
          if [[ "${{ matrix.arch }}" == "i386" ]]; then
            echo -e "MAKE_ENV=ARCH=i386 CROSS_COMPILE=i686-linux-gnu-" >> ${GITHUB_ENV}
            echo -e "ARCH_DESC=\`i386\` / \`i686\` / \`ia32\` / \`x86\` / \`x86-32\`" >> ${GITHUB_ENV}
          fi
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            echo -e "MAKE_ENV=" >> ${GITHUB_ENV}
            echo -e "ARCH_DESC=\`arm64\` / \`aarch64\`" >> ${GITHUB_ENV}
          fi
          if [[ "${{ matrix.arch }}" == "armhf" ]]; then
            echo -e "MAKE_ENV=ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- KBUILD_DEBARCH=armhf" >> ${GITHUB_ENV}
            echo -e "ARCH_DESC=\`armhf\` / \`armv7\` / \`arm\` / \`arm32\` / \`aarch32\` (hard-float)" >> ${GITHUB_ENV}
          fi
          if [[ "${{ matrix.arch }}" == "riscv64" ]]; then
            echo -e "MAKE_ENV=ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu-" >> ${GITHUB_ENV}
            echo -e "ARCH_DESC=\`riscv64\`" >> ${GITHUB_ENV}
          fi

          if [[ "${{ matrix.branch }}" == "linux-rolling-stable" ]]; then
            echo -e "BRANCH_DESC=stable" >> ${GITHUB_ENV}
          elif [[ "${{ matrix.branch }}" == "linux-rolling-lts" ]]; then
            echo -e "BRANCH_DESC=LTS" >> ${GITHUB_ENV}
          elif [[ "${{ matrix.branch }}" == "linux-6.1.y" ]]; then
            echo -e "BRANCH_DESC=6.1 LTS" >> ${GITHUB_ENV}
          else
            echo -e "BRANCH_DESC=${{ matrix.branch }}" >> ${GITHUB_ENV}
          fi
      
      - name: "checkout"
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.branch == 'v3' && github.repository || 'gregkh/linux' }}
          ref: ${{ matrix.branch }}
          fetch-depth: ${{ matrix.branch == 'v3' && 1 || 0 }}

      - name: "patch"
        if: ${{ matrix.branch != 'v3' }}
        run: |
          curl -LO "https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/build/patches/${{ matrix.branch }}.patch"
          git apply -3 ${{ matrix.branch }}.patch

      - name: "dependencies"
        run: |
          sudo dpkg --add-architecture ${{ matrix.arch }}
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper-compat=12 libelf-dev bc libdw-dev
          sudo apt-get install -y crossbuild-essential-${{ matrix.arch }}
          sudo apt-get install -y libssl-dev:${{ matrix.arch }}
          sudo apt-get clean
          sudo apt-get autoremove
        
      - name: "configure"
        run: |
          make ${{ env.MAKE_ENV }} olddefconfig

      - name: "tag"
        run: |
          KERNEL_VER=$(make kernelversion)
          TAG_NAME=linux-$KERNEL_VER-bbr3-${{ matrix.arch }}
          TAG_EXISTS=$(curl -s -o /dev/null -w "%{http_code}" "https://api.github.com/repos/${{ github.repository }}/git/ref/tags/$TAG_NAME" | grep -q '^200$' && echo true || echo false)
          echo -e "KERNEL_VER=$KERNEL_VER" >> ${GITHUB_ENV}
          echo -e "TAG_NAME=$TAG_NAME" >> ${GITHUB_ENV}
          echo -e "TAG_EXISTS=$TAG_EXISTS" >> ${GITHUB_ENV}
      
      - name: "release notes"
        if: ${{ env.TAG_EXISTS == 'false' }}
        id: release_notes
        uses: actions/github-script@v7
        with:
          script: |
            if (!process.env.TAG_NAME.endsWith('-amd64')) {
              core.setOutput('body', [
                `**Target Architecture:** ${process.env.ARCH_DESC}`,
                '',
                `See [this release](https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/linux-${process.env.KERNEL_VER}-bbr3-amd64) for detailed release notes.`
              ].join('\n'));
              return;
            }
            const { KERNEL_VER: version, BRANCH_DESC: branch, ARCH_DESC: arch } = process.env;
            if (!/^\d+\.\d+(?:\.\d+)?$/.test(version)) {
              throw new Error(`Cannot determine an upstream release date for ${version}`);
            }
            const changelogUrl = `https://cdn.kernel.org/pub/linux/kernel/v${version.split('.')[0]}.x/ChangeLog-${version}`;
            let changelog;
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                const response = await fetch(changelogUrl, { signal: AbortSignal.timeout(60000) });
                if (!response.ok) throw new Error(`HTTP ${response.status} fetching ${changelogUrl}`);
                changelog = await response.text();
                break;
              } catch (error) {
                if (attempt === 3) throw error;
                core.warning(`Changelog fetch failed; retrying: ${error.message}`);
              }
            }
            // Only inspect the release commit, never an older commit's date.
            const firstCommit = changelog.split(/^commit /m)[1];
            if (!firstCommit || !firstCommit.split('\n').some(line => line.trim() === `Linux ${version}`)) {
              throw new Error(`Changelog does not start with the Linux ${version} release commit`);
            }
            const dateLine = firstCommit.match(/^Date:\s+(.+)$/m)?.[1];
            // Preserve the calendar date in the author's timezone, even near midnight.
            const date = dateLine && new Date(dateLine.replace(/ [+-]\d{4}$/, ' +0000'));
            if (!date || Number.isNaN(date.getTime())) throw new Error('Missing or invalid release date');
            const releaseDate = date.toISOString().slice(0, 10);
            
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100
            });
            const compare = (a, b) => {
              const left = a.split('.').map(Number);
              const right = b.split('.').map(Number);
              for (let i = 0; i < 3; i++) {
                const difference = (left[i] || 0) - (right[i] || 0);
                if (difference) return difference;
              }
              return 0;
            };
            const previous = releases
              .filter(release => !release.draft && !release.prerelease)
              .map(release => ({ release, version: release.tag_name.match(/^linux-(\d+\.\d+(?:\.\d+)?)-bbr3-amd64$/)?.[1] }))
              .filter(item => item.version && compare(item.version, version) < 0 &&
                item.release.body?.includes(`*latest ${branch} kernel*`))
              .sort((a, b) => compare(b.version, a.version))[0]?.release;
            const lines = [
              `**Target Architecture:** ${arch}`,
              '',
              `This is the *latest ${branch} kernel* released on ${releaseDate}.`,
              `[Upstream changelog](${changelogUrl}).`
            ];
            if (previous) {
              lines.push(`See [this release](${previous.html_url}) for modifications made in a previous version.`);
            }
            core.setOutput('body', lines.join('\n'));

      - name: "make"
        if: ${{ env.TAG_EXISTS == 'false' }}
        run: |
          make ${{ env.MAKE_ENV }} -j$(nproc) bindeb-pkg LOCALVERSION=-bbr3 KDEB_PKGVERSION=${{ env.KERNEL_VER }}-bbr3
      
      - name: "release"
        if: ${{ env.TAG_EXISTS == 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          make_latest: "false"
          files: ../linux-*.deb
          target_commitish: ${{ matrix.branch == 'v3' && matrix.branch || 'build' }}
          tag_name: ${{ env.TAG_NAME }}
          name: "Linux ${{ env.KERNEL_VER }} BBR-v3 ${{ matrix.arch }}"
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: false
          append_body: false
          body: ${{ steps.release_notes.outputs.body }}
